services:
  web:
    build: .
    container_name: grow_deck_automator
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./generated_decks:/app/generated_decks
      - ./Estimador S0 V2.0.xlsx:/app/Estimador S0 V2.0.xlsx:ro
    environment:
      - PYTHONUNBUFFERED=1
      - DB_NAME=/app/data/proposals.db
      - OUTPUT_DIR=/app/generated_decks
      # Definir en un archivo .env junto a este docker-compose.yml (Compose lo
      # carga automáticamente para sustituir estas variables ${...}):
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-}
      - API_TOKEN=${API_TOKEN:-}
      # Proxies delante del contenedor. 0 = acceso directo. Ponerlo a 1 solo
      # con un reverse proxy propio: declarar más de los que hay permite
      # falsificar X-Forwarded-For y saltarse el límite de peticiones.
      - TRUST_PROXY_COUNT=${TRUST_PROXY_COUNT:-0}
      - DIAS_RETENCION=${DIAS_RETENCION:-365}
    restart: unless-stopped
    # Endurecido del contenedor: sin escalada de privilegios y sin las
    # capacidades de Linux que esta aplicación no necesita (no abre puertos
    # privilegiados dentro del contenedor ni manipula la red).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    depends_on:
      db-init:
        condition: service_completed_successfully

  db-init:
    image: python:3.11-slim
    volumes:
      - ./data:/app/data
      - .:/app/src
    working_dir: /app/src
    environment:
      - DB_NAME=/app/data/proposals.db
    command: >
      sh -c "python scripts/database_setup.py && echo 'DB initialized'"
    restart: "no"
